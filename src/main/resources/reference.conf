# ======================================== #
# Micrometer-Pekko Reference Configuration #
# ======================================== #

micrometer.pekko {
  histogram.buckets.enabled = true
  # Reads Mailbox.numberOfMessages for every tracked actor when scraped. The default unbounded mailbox
  # is backed by a ConcurrentLinkedQueue, whose size() walks the queue, so this is off by default.
  mailbox.number-of-messages.enabled = false
  # Records time in mailbox against the actor's dispatcher, for every actor rather than only the tracked
  # ones, so that the per dispatcher view is complete. That is a timer recording on every message, so it
  # is off by default.
  dispatcher.time-in-mailbox.enabled = false
  match.events = true
  # executor-service.style can be `internal` or `core`
  # metrics are presented in legacy style or registered using io.micrometer.core.instrument.binder.jvm.ExecutorServiceMetrics
  executor-service.style = "internal"
  metric.filters {
    pekko-actor {
      includes = []
      excludes = [ "*/system/**", "*/user/IO-**" ]
    }

    pekko-router {
      includes = []
      excludes = []
    }

    pekko-dispatcher {
      includes = ["**"]
      excludes = []
    }

    pekko-actor-groups {
      //include empty actor-group to demonstrate the config
      empty {
        includes = []
        excludes = ["**"]
      }
    }
  }
}
